# Run from the repository root:  docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hemcenter
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/.env}
      POSTGRES_DB: hemcenter
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hemcenter"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hemcenter:${DB_PASSWORD}@db:5432/hemcenter
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random characters) in infra/.env}
      TOTP_KEY: ${TOTP_KEY:?set TOTP_KEY in infra/.env}
      NODE_ENV: production
      PORT: 4000
      # 2FA is mandatory for administrators and management. false = TEST SERVERS ONLY.
      REQUIRE_ADMIN_TOTP: ${REQUIRE_ADMIN_TOTP:-true}
      FILES_DIR: /data/files
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost.invalid}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Almaty}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      # Word only by default. For PDF: PDF_ENABLED=true and GOTENBERG_URL=http://gotenberg:3000 in infra/.env, start with --profile pdf
      PDF_ENABLED: ${PDF_ENABLED:-false}
      GOTENBERG_URL: ${GOTENBERG_URL:-}
      ORG_NAME_RU: ${ORG_NAME_RU:-Центр гематологии}
      ORG_NAME_KK: ${ORG_NAME_KK:-Гематология орталығы}
    volumes:
      # attachments; back this volume up together with the database
      - files:/data/files

  # Optional: turns Word documents into PDF (LibreOffice inside, about 1 GB of RAM). Only with --profile pdf.
  gotenberg:
    profiles: ["pdf"]
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  # --- tools, started by hand or by cron (see docs/operations.md) ---------------------------------------------------
  # docker compose -f infra/docker-compose.yml --env-file infra/.env --profile tools run --rm backup
  backup:
    profiles: ["tools"]
    build:
      context: ./backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hemcenter:${DB_PASSWORD}@db:5432/hemcenter
      FILES_DIR: /data/files
      BACKUP_DIR: /backups
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_pass
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - files:/data/files:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    secrets:
      - backup_pass
    entrypoint: ["/scripts/backup.sh"]

  # docker compose ... --profile tools run --rm restore /backups/hemcenter-YYYYMMDD-HHMMSS.tar.gpg
  # Add CONFIRM_OVERWRITE=yes (-e CONFIRM_OVERWRITE=yes) to replace a database that already has data.
  restore:
    profiles: ["tools"]
    build:
      context: ./backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hemcenter:${DB_PASSWORD}@db:5432/hemcenter
      FILES_DIR: /data/files
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_pass
    volumes:
      - files:/data/files
      - ${BACKUP_HOST_DIR:-./backups}:/backups:ro
    secrets:
      - backup_pass
    entrypoint: ["/scripts/restore.sh"]

  # docker compose ... --profile tools run --rm --entrypoint /scripts/verify-restore.sh backup /backups/hemcenter-....tar.gpg
  # (the "restore drill": opens the backup in a scratch database and compares counts; touches nothing of the live system)

secrets:
  backup_pass:
    # a file with the backup passphrase, chmod 600, kept OUT of the repository and also written down in the safe
    file: ./backup.pass

volumes:
  files:
  dbdata:
  caddydata:
  caddyconfig:
